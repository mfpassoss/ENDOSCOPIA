appId: br.com.marcelopassos.endolaudo
productName: EndoLaudo
copyright: Dr. Marcelo Ferraz Passos
directories:
  buildResources: resources
  output: dist
files:
  - out/**
  - package.json
asarUnpack:
  - "**/*.node"
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-Setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  language: 1046
mac:
  target: [dmg]
  category: public.app-category.medical
  artifactName: ${productName}-${version}.${ext}
npmRebuild: true
